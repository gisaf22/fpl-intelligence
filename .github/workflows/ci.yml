name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (fixture DB)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy  # blocking gate — production scope per [tool.mypy] files=

      - name: Import contracts (import-linter)
        run: uv run lint-imports  # blocking gate — enforces .importlinter layer boundaries

      - name: Build fixture DB
        run: uv run python tests/fixtures/create_test_db.py

      - name: Unit tests
        run: uv run pytest -m unit -v --tb=short

      # Integration-tier tests that read only committed fixtures (warehouse/fixtures/), not the
      # live DB the job below needs. Scoped by path: `-m integration` alone would collect those too.
      - name: Integration tests (committed fixtures)
        run: uv run pytest warehouse -m integration -v --tb=short

  integration-tests:
    name: Integration tests (live DB)
    runs-on: ubuntu-24.04
    if: false  # requires ~/.fpl/fpl.db — run manually or on self-hosted runner with DB access

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Integration tests
        run: uv run pytest -m integration -v --tb=short
