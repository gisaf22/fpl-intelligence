# decisions/starting_xi/PRE_REGISTRATION.yaml -- the Stage 3 test design, frozen 2026-10-17
# (CARD.md §3; decisions on #30, #31, #32, #33), and the Stage 5 entries (verdict, power lab,
# evaluation panel, realism check, look), each named in its own comment below.
#
# Mirror-and-pin, not config: each value is owned by the code named beside it. The pre-run check
# (operational.starting_xi.pre_registration_mismatches) compares the run and that code against
# this file, and test_pre_registration_freeze.py pins the file itself. A change to the design is a
# diff against this file, never a silent drift.

# rankers.rules(master_seed), by name.
rules:
  - ppg_appearance_last3
  - ppg_appearance_season
  - ppg_fixture_last3
  - ppg_fixture_season
  - ppg_gameweek_last3
  - ppg_gameweek_season
  - ppg_start_last3
  - ppg_start_season
  - random
  - starts_rate_x_points_per_appearance

# rankers.RULE_WINDOW. The canonical run builds and scores exactly these gameweeks.
scored_gameweeks: { first_gw: 4, last_gw: 38 }

# report.PHASES, edges inclusive.
phases:
  "4-12": [4, 12]
  "13-26": [13, 26]
  "27-38": [27, 38]

# sampler.SQUAD_MODES. One run per mode.
squad_modes: [uniform, ownership]

# run_study's n_squads; no code constant carries it.
squads_per_gameweek: 300

# Each gameweek draws its own squads (a squad belongs to one gameweek); a property of the sampler.
construction: weekly

# The sampler's and the random rule's master seed.
master_seed: 0

# orderings.PRE_REGISTERED_ORDERINGS, element 0 primary.
bench_ordering: [by_rank]

# uncertainty.N_RESAMPLES / BLOCK_GWS / CI_LEVEL / SEED: report.py's paired block-bootstrap range.
gameweek_interval: { n: 10000, block: 4, ci_level: 0.95, seed: 0 }

# Stage 5's verdict (#55 decisions 10-11, P3, P4, P6; #60 L), added 2026-10-28: verdict.py's constants.
# The four groups are Holm-adjusted together; the p-value is two-sided and unrounded.
stage5_verdict:
  groups: [overall, top, middle, bottom]
  sides: 2
  null_share: 0.5
  family_wise_alpha: 0.05
  p_value: one_plus_k_over_one_plus_b
  n_resamples: 10000
  seed: 0
  rerun_resamples: 100000
  rerun_seed: 1

# Stage 5's power simulation lab (#60), added 2026-10-28: power_lab.py's and power_report.py's
# constants. The shock and manager-effect sizes are assumptions (SD of a gameweek's / a manager's true
# win share, in points), not measurements. false_alarm_max_firings is N2's count for fake_studies;
# it is recomputed and re-recorded here before any run with a different number of fake studies.
power_lab:
  true_win_shares: [0.51, 0.52, 0.53, 0.55, 0.58, 0.60]
  tie_rates: [0.2, 0.4, 0.6]
  effect_levels: [small, medium, large]
  shock_sd_points: { small: 2, medium: 4, large: 6 }
  manager_effect_sd_points: { small: 5, medium: 10, large: 15 }
  gameweek_sweep: [5, 8, 12, 16, 24, 38]
  manager_sweep: [500, 1000, 2000]
  baseline: { shock: medium, manager_effect: medium, tie_rate: 0.4, gameweeks: 5, managers: 2000 }
  worst_case_corner: { shock: large, manager_effect: large, tie_rate: 0.6, gameweeks: 5, managers: 2000 }
  settings:
    - baseline
    - shock_small
    - shock_large
    - manager_effect_small
    - manager_effect_large
    - ties_20
    - ties_60
    - gameweeks_8
    - gameweeks_12
    - gameweeks_16
    - gameweeks_24
    - gameweeks_38
    - managers_500
    - managers_1000
    - worst_case_corner
    - worst_case_corner_gameweeks_8
    - worst_case_corner_gameweeks_12
    - worst_case_corner_gameweeks_16
    - worst_case_corner_gameweeks_24
    - worst_case_corner_gameweeks_38
    - worst_case_corner_managers_500
    - worst_case_corner_managers_1000
  fake_studies: 1000
  inner_resamples: 10000
  false_alarm_max_firings: 63
  sensitivity: { setting: worst_case_corner, share: 0.65, min_power: 0.99 }
  pass_mark: 0.8
  headline_edge: 0.55
  secondary_edge: 0.53
  master_seed: 60
  # The extra-large shock probe (#65), added 2026-10-29: power_lab.PROBE_*. One no-edge cell per
  # probed gameweek count per anchor, at a 9-point gameweek shock (an assumption, outside the swept
  # sizes). Reported alongside the grid; it never invalidates a gameweek count.
  probe:
    shock_sd_points: 9
    share: 0.5
    gameweeks: [8, 12, 16]
    anchors: [worst_case_corner, baseline]

# The Stage 5 evaluation panel (https://github.com/gisaf22/fpl-intelligence/issues/70), added
# 2026-11-02; the rules are decisions 4, 5 and 12 on
# https://github.com/gisaf22/fpl-intelligence/issues/55. A manager-week is in the panel at a tenure
# of three gameweeks or less, or from tenure 4 if the screen passes on the 3 week-over-week
# comparisons ending at the scored gameweek. Bands are `band_count` equal shares of all ranked teams
# in integer arithmetic, with r the previous gameweek's overall_rank and N its ranked_count: top if
# 3r <= N, middle if 3r <= 2N, bottom otherwise, so a rank on a boundary (3r == N, 3r == 2N) goes to
# the better band. A null or 0 rank gives a null band and the manager stays in the panel.
evaluation_panel:
  activity_window: 3 # picks_profile.ACTIVITY_WINDOW
  first_screened_tenure: 4 # picks_profile.FIRST_SCREENED_TENURE
  excluded_cohorts: [self] # evaluation_panel.EXCLUDED_COHORTS
  rank_lag_gameweeks: 1 # evaluation_panel.RANK_LAG_GAMEWEEKS
  band_count: 3 # evaluation_panel.BAND_COUNT
  boundary_rank_goes_to: better_band # evaluation_panel.BOUNDARY_RANK_GOES_TO
  null_or_zero_rank_band: null # evaluation_panel.NULL_OR_ZERO_RANK_BAND

# The Stage 5 realism check (https://github.com/gisaf22/fpl-intelligence/issues/66): the revised
# D-C3, D-C4 and D-C5 on https://github.com/gisaf22/fpl-intelligence/issues/55. Run after the
# freeze, never used to change a lab setting.
realism_check:
  statistic: spread_across_gameweeks_of_weekly_win_share # realism.STATISTIC
  spread_ddof: 1 # realism.SPREAD_DDOF
  unit: win_share_points # realism.UNIT
  gameweeks: { first_gw: 4, last_gw: 15 } # realism.VERDICT_GAMEWEEKS
  prints_mean: false # realism.PRINTS_MEAN
  label: per_gameweek_count # realism.LABEL

# The Stage 5 descriptive look (https://github.com/gisaf22/fpl-intelligence/issues/73 D-N10): it
# stops at GW8 however far its pin reaches, its gameweeks sit inside the verdict's, and each pin
# serves one purpose. The look pin's run id is recorded at the re-pin
# (https://github.com/gisaf22/fpl-intelligence/issues/76), not here.
look:
  ceiling_gw: 8 # starting_xi_stage5.LOOK_CEILING_GW
  overlap: { look: { first_gw: 4, last_gw: 8 }, verdict: { first_gw: 4, last_gw: 15 } } # rankers.RULE_WINDOW[0], LOOK_CEILING_GW; realism.VERDICT_GAMEWEEKS
  once_per_purpose: true # starting_xi_stage5.ONCE_PER_PURPOSE
