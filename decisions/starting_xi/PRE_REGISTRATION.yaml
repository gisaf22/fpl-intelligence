# decisions/starting_xi/PRE_REGISTRATION.yaml
#
# DESIGN.md §7.4: "the frozen file carries: the three naive rankers and their declared windows,
# n = 10000, block = 4, the 10% materiality threshold, the requirement that both intervals exclude
# zero, the three success criteria, the squad count of 300 per gameweek, the build gameweek set
# (GW2-38), the resampling scheme -- weekly resampling, and U1 stratified by gameweek (§10.3) --
# the master seed, and the bench ordering. A test pins those values."
#
# Mirror-and-pin, not root-reads-YAML-at-runtime: this file does not drive the harness. Every value
# below is the operational/starting_xi.py composition root's own constant or the literal it passes
# at its call sites; this file mirrors them so a later change is a *diff against a frozen file*
# rather than a silent drift. test_pre_registration_freeze.py asserts the mirror holds, importing
# each canonical value from the module that owns it wherever a code constant exists.

floor_rankers:
  # rankers.DECLARED_WINDOWS -- name -> [first_gw, last_gw]. §0.12, §6.3.
  F1_p_play: [4, 38]
  F2_season_ppg: [2, 38]
  F3_form_roll3: [2, 38]

bench_ordering:
  # orderings.PRE_REGISTERED_ORDERINGS, ordered, element 0 primary. §4.12, §5.4.1.
  - by_rank

population:
  # Not a Final in code -- n_squads is `run_study`'s required argument with no default (§2.9,
  # §8.4). 300 is §0.16's own selection and has no other canonical source; pinned here as a
  # literal, the same way test_uncertainty.py pins n/ci_level/seed/block as literals rather than
  # importing them from a second location.
  squads_per_gameweek: 300
  # rankers.STUDY_FIRST_GW / rankers.STUDY_LAST_GW. §0.7, §0.16.
  build_gameweeks: { first_gw: 2, last_gw: 38 }

resampling_scheme:
  # §0.16: weekly resampling, not build-once-and-hold. Not a code constant -- a construction
  # property confirmed structurally (squad_id appears at exactly one gw, §2.8) rather than read
  # from a Final; pinned here as a literal per §7.4's own instruction that the scheme belongs in
  # the frozen file precisely because it is now a choice rather than a constant.
  construction: weekly
  # §10.3: U1 (the squad interval) resamples squad-weeks with replacement, independently within
  # each gameweek, holding each gameweek's row count fixed -- i.e. stratified by gw.
  squad_interval_stratified_by: gw
  # §10.1: the squad interval takes no block parameter -- nothing to preserve within a stratum.
  squad_interval_block: null
  # uncertainty.BLOCK_GWS. §0.14, §10.1: U2 (the gameweek interval) blocks consecutive gameweeks.
  gameweek_interval_block: 4

intervals:
  # uncertainty.N_RESAMPLES / uncertainty.CI_LEVEL / uncertainty.SEED. §0.14, §10.1, §10.8.
  n: 10000
  ci_level: 0.95
  seed: 0

# uncertainty.SEED, and §8.4: "seed = 0 at every call site in the slice" -- the sampler's master
# seed included, not merely the two intervals'. One convention, one value, two call sites.
master_seed: 0

success_criteria:
  # results.T3_COLUMNS' crit_* names. §0.15: S1 and S2 and S3, all three; any two is a fail.
  - crit_direction
  - crit_significance
  - crit_materiality

significance:
  # §0.15: "S2 is satisfied only if both the squad-resampled and the gameweek-resampled intervals
  # exclude zero" -- not either. Behavioural, not a constant; test_pre_registration_freeze.py
  # exercises operational.starting_xi._evaluate_bar directly to pin the AND rather than an OR.
  requires_both_intervals_exclude_zero: true

materiality:
  # operational.starting_xi.MATERIALITY_THRESHOLD. §0.15: relative to the floor's own mean regret.
  threshold: 0.10
  relative_to: floor_mean_regret
