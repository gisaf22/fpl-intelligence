# Operational Weight Registry
# Version: 2.0
# Produced: 2026-05-27
# Revised: 2026-05-27 — registry rebuild; the synthesis study composition weights in synth01_decisions.yaml
#
# WEIGHTING AUTHORITY (ADR-010 ruling a): model/assemble/synth01_decisions.yaml is the single
# weighting authority (Model owns weighting). This registry DERIVES FROM or DEFERS TO it and does
# not originate study-derived weighting. Every signal_id / derived_from.findings key referenced
# below must be a finding the authority evaluated (enforced by tests/test_weighting_authority.py).
# Components that make no study-derivation claim are PROVISIONAL-EDITORIAL (signal_id: null).
#
# IMPORTANT: Intelligence module weights (captain, value, transfers, fixtures) remain
# PROVISIONAL-EDITORIAL. They are editorial judgments set before the lens-study methodology
# was established. the synthesis study produced composition weights for DEF/MID signal groups, stored in
# model/assemble/synth01_decisions.yaml. Those weights govern signal composition, not
# module-level blending. Module weight calibration requires a dedicated calibration study.
#
# FDR MODERATION — MATERIAL:
# the synthesis study sensitivity check found that FDR quartile conditioning changes signal rank
# ordering in >15% of cases for all 3 checked groups (DEF × FORM, MID × FORM, MID × AVAIL).
# Implementation deferred; fixture_context DGW binary is the current operational FDR proxy.
#
# Loading: serve/weight_registry.py — hard-fails if a module or weight key
# is absent from this file. No silent defaults anywhere in the serve layer.
#
# Key decisions reflected here:
#   - fdr_avg removed from all scoring weights (fdr_avg excluded at all positions in
#     the fixture_gw lens — non-monotonic quintile ordering at every position)
#   - fixture contribution uses binary DGW from STATE fixture_context column
#     (reads governed STATE column rather than spine is_dgw flag)
#   - FWD scope guard applied to all xgi_roll3/5 consumers
#     (xgi_roll3/5 excluded at FWD by lens evaluation — non-monotonic quintile ordering, G2-FAIL)

schema_version: "2.0"
produced: "2026-05-27"
synth01_composition_weights: "model/assemble/synth01_decisions.yaml"
fdr_moderation_status: "MATERIAL — FDR quartile conditioning changes rank ordering in >15% of cases; implementation deferred"

modules:

